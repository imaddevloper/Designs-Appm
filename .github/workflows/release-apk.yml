name: Build Signed Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper (8.9)
        run: |
          set -e
          if [ ! -x ./gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "⚠️ gradlew مفقود — توليد Wrapper بإصدار 8.9 (متوافق مع AGP 8.7.3)"
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x ./gradlew
          ./gradlew --version

      - name: Validate Keystore Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 فارغ. أضفه في إعدادات المستودع (Secrets)."
            exit 1
          fi
          echo "✅ ANDROID_KEYSTORE_BASE64 موجود"

      - name: Decode Keystore
        id: decode_keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
          if ! keytool -list -keystore app/release.keystore \
                -storepass "$KEYSTORE_PASSWORD" \
                -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::keystore تالف، أو كلمة مرور المخزن/Alias غير صحيحة."
            exit 1
          fi
          KEYSTORE_ABS="$(realpath app/release.keystore)"
          echo "keystore_path=$KEYSTORE_ABS" >> $GITHUB_OUTPUT
          echo "✅ Keystore صالح: $KEYSTORE_ABS"

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ steps.decode_keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # ✅ فحص ديناميكي: نمر على كل APK ونختار أول واحد يثبت apksigner أنه موقّع
      - name: Locate and Verify Signed APK
        id: find_signed_apk
        run: |
          set -e
          echo "📦 البحث عن APK في مجلد release:"
          find app/build/outputs/apk/release -maxdepth 2 -type f -name "*.apk" -print || true

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          [ -n "$APKSIGNER" ] || { echo "::error::apksigner غير موجود."; exit 1; }

          SIGNED_APK=""
          for apk in $(find app/build/outputs/apk/release -maxdepth 2 -type f -name "*.apk"); do
            echo "🧪 فحص التوقيع لـ: $apk"
            # إخراج شهادة التوقيع للتحقق من الهوية
            if "$APKSIGNER" verify --verbose --print-certs "$apk" > /tmp/cert_info.log 2>&1; then
              echo "✅ توقيع صالح لـ: $apk"
              echo "--- معلومات الشهادة (تأكد أنها شهادتك) ---"
              grep "Signer #1 certificate DN" /tmp/cert_info.log || true
              grep "Signer #1 certificate SHA-256" /tmp/cert_info.log || true
              echo "----------------------------------------"
              SIGNED_APK="$apk"
              break
            else
              echo "❌ توقيع غير صالح أو غير موقّع: $apk"
            fi
          done

          if [ -z "$SIGNED_APK" ]; then
            echo "::error::لم يتم العثور على أي APK بتوقيع صالح."
            exit 1
          fi
          echo "apk_path=$SIGNED_APK" >> $GITHUB_OUTPUT

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.find_signed_apk.outputs.apk_path }}
          if-no-files-found: error
